<h1>Student List</h1>

<a href="{% url 'student_create' %}">Register Student</a>

<hr>

{% for student in students %}
<p>
    <strong>{{ student.student_name }}</strong><br>
    Program: {{ student.program }}<br>
    Year Level: {{ student.year_level }}<br>
    Email: {{ student.email }}<br>

    <a href="{% url 'student_update' student.pk %}">Edit</a>
    <a href="{% url 'student_delete' student.pk %}">Delete</a>
</p>

<hr>
{% empty %}
<p>No students registered yet.</p>
{% endfor %}
